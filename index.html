<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- BEGIN generated security meta: python3 scripts/sync-security-meta.py --write -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://marincountygov.github.io/marin-os/catalog.json https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- END generated security meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>APP_NAME | County of Marin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23000'/%3E%3Cg fill='none' stroke='%23e5b53b' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' transform='translate(9,9) scale(1.25)'%3E%3Crect width='7' height='7' x='3' y='3' rx='1'/%3E%3Crect width='7' height='7' x='14' y='3' rx='1'/%3E%3Crect width='7' height='7' x='14' y='14' rx='1'/%3E%3Crect width='7' height='7' x='3' y='14' rx='1'/%3E%3C/g%3E%3C/svg%3E">
    <meta name="description" content="APP_DESCRIPTION">
    <link rel="stylesheet" href="vendor/marinos/marinos.css">
    <link rel="stylesheet" href="assets/app.css">
    <script src="vendor/marinos/marinos.js" defer></script>
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <noscript>
      <div class="container app-alert app-alert--warning">
        JavaScript is required to display the MarinOS interface and use this application.
      </div>
    </noscript>

    <marin-os-banner></marin-os-banner>

    <marin-app-header app-name="APP_NAME" app-description="APP_DESCRIPTION">
      <template data-icon>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect width="7" height="7" x="3" y="3" rx="1"/>
          <rect width="7" height="7" x="14" y="3" rx="1"/>
          <rect width="7" height="7" x="14" y="14" rx="1"/>
          <rect width="7" height="7" x="3" y="14" rx="1"/>
        </svg>
      </template>
    </marin-app-header>

    <main id="main" class="container app-main">
      <!-- Keep the primary workflow first; the shell uses it as the default view. -->
      <section id="start" class="app-page-heading" data-tab-section="start" aria-labelledby="start-heading">
        <h2 id="start-heading">Start the primary task</h2>
        <p>Replace this content with the APP_NAME workflow.</p>
      </section>

      <!-- Supply app-owned content only; the shell generates sections and headings. -->
      <marin-app-info app-name="APP_NAME" repo="APP_REPO" security-src="security.json">
        <template data-about>
          <p>Add task-specific and about info here.</p>
        </template>
        <template data-accessibility>
          <p>Document accessibility support, known issues, and how users can report an accessibility problem.</p>
        </template>
      </marin-app-info>
    </main>

    <marin-app-footer app-name="APP_NAME"></marin-app-footer>
    <marin-app-feedback></marin-app-feedback>
  </body>
</html>
