name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: marin-reach
      # marin-data.lock names the marin-data commit this repo last synced. It is checked out next to this repo,
      # so scripts/check.sh can compare the copies. With no lock file, those checks are skipped.
      - name: Read marin-data.lock
        id: lock
        run: |
          if [ -f marin-reach/marin-data.lock ]; then echo "sha=$(tr -d '[:space:]' < marin-reach/marin-data.lock)" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.lock.outputs.sha != ''
        with:
          repository: marincountygov/marin-data
          ref: ${{ steps.lock.outputs.sha }}
          path: marin-data
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
        working-directory: marin-reach
      - run: python -m playwright install --with-deps chromium
        working-directory: marin-reach
      - run: bash scripts/check.sh --browser
        working-directory: marin-reach
